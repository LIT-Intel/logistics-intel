  /public/iy/companyStats:
    get:
      summary: "ImportYeti – company stats and route KPIs"
      operationId: iyCompanyStats
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      parameters:
        - name: "company_id"
          in: "query"
          type: "string"
          required: true
      responses:
        "200":
          description: "Company stats"
    options:
      summary: "CORS preflight"
      operationId: optionsIyCompanyStats
      x-google-backend:
