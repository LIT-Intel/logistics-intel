swagger: "2.0"
info:
  title: "Logistics Intel API"
  description: "API Gateway config for Logistics Intel search + ImportYeti + CRM"
  version: "2025-11-25"

schemes:
  - https

produces:
  - application/json
consumes:
  - application/json

x-google-endpoints:
  - name: logistics-intel-gateway-2e68g4k3.uc.gateway.dev
    allowCors: true

securityDefinitions:
  api_key:
    type: "apiKey"
    name: "key"
    in: "query"

security:
  - api_key: []

paths:
  /public/status:
    get:
      summary: "LIT Search status"
      operationId: getStatus
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      responses:
        "200":
          description: "OK"
    options:
      summary: "CORS preflight"
      operationId: optionsStatus
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      responses:
        "204":
          description: "No Content"

  /public/searchCompanies:
    post:
      summary: "Legacy Panjiva-style company search (LIT internal)"
      operationId: searchCompanies
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              q:
                type: "string"
              limit:
                type: "integer"
              offset:
                type: "integer"
      responses:
        "200":
          description: "Search results"
    options:
      summary: "CORS preflight"
      operationId: optionsSearchCompanies
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      responses:
        "204":
          description: "No Content"

  /public/getFilterOptions:
    get:
      summary: "Legacy filter options for LIT Search"
      operationId: getFilterOptions
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      responses:
        "200":
          description: "Filter options"
    options:
      summary: "CORS preflight"
      operationId: optionsGetFilterOptions
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      responses:
        "204":
          description: "No Content"

  /public/getCompanyShipments:
    get:
      summary: "Company shipments (BigQuery-backed)"
      operationId: getCompanyShipments
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      parameters:
        - name: "companyId"
          in: "query"
          type: "string"
          required: true
        - name: "limit"
          in: "query"
          type: "integer"
        - name: "offset"
          in: "query"
          type: "integer"
      responses:
        "200":
          description: "Shipment list"
    options:
      summary: "CORS preflight"
      operationId: optionsGetCompanyShipments
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
      responses:
        "204":
          description: "No Content"

  /public/iy/searchShippers:
    post:
      summary: "LIT Search – ImportYeti shipper search"
      operationId: iySearchShippers
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              q:
                type: "string"
              query:
                type: "string"
              page:
                type: "integer"
              pageSize:
                type: "integer"
              limit:
                type: "integer"
              offset:
                type: "integer"
      responses:
        "200":
          description: "ImportYeti shipper search results"
    options:
      summary: "CORS preflight"
      operationId: optionsIySearchShippers
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
