  /crm/saveCompany:
    post:
      summary: "Save company to Command Center (prospect stage)"
      operationId: crmSaveCompany
      x-google-backend:
        address: https://search-unified-gxezx63yea-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            properties:
              company_id:
                type: "string"
              stage:
                type: "string"
