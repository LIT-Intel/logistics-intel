swagger: "2.0"
info: { title: "LIT Gateway — Search Unified", version: "v2" }
schemes: ["https"]
produces: ["application/json"]

paths:
  /public/status:
    options:
      operationId: cors_status
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      responses: { "200": { description: "ok" } }
    get:
      operationId: status
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      responses: { "200": { description: "ok" } }

  /public/getFilterOptions:
    options:
      operationId: cors_getFilterOptions
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      responses: { "200": { description: "ok" } }
    get:
      operationId: getFilterOptions
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      responses: { "200": { description: "ok" } }

  /public/searchCompanies:
    options:
      operationId: cors_searchCompanies
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      responses: { "200": { description: "ok" } }
    post:
      operationId: searchCompanies
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              q:        { type: string }
              page:     { type: integer }
              pageSize: { type: integer }
      responses: { "200": { description: "ok" } }

  /public/getCompanyShipments:
    options:
      operationId: cors_getCompanyShipments
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      responses: { "200": { description: "ok" } }
    get:
      operationId: getCompanyShipments
      security: []
      x-google-backend: { address: __SERVICE_URL__, jwt_audience: __SERVICE_URL__ }
      parameters:
        - { name: company_id, in: query, type: string, required: true }
        - { name: limit,      in: query, type: integer, required: false }
        - { name: offset,     in: query, type: integer, required: false }
      responses: { "200": { description: "ok" } }

  /public/iy/searchShippers:
    post:
      summary: ImportYeti shipper search
      operationId: iySearchShippers
      x-google-backend:
        address: https://search-unified-187580267283.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              q:        { type: string }
              page:     { type: integer }
              pageSize: { type: integer }
      responses:
        '200':
          description: OK
    options:
      summary: CORS preflight
      operationId: corsIySearchShippers
      security: []
      responses:
        '204':
          description: No content
          headers:
            Access-Control-Allow-Origin:      { type: string, default: "*" }
            Access-Control-Allow-Methods:     { type: string, default: "GET,POST,OPTIONS" }
            Access-Control-Allow-Headers:     { type: string, default: "Content-Type,Authorization" }
            Access-Control-Max-Age:          { type: string, default: "3600" }

  /public/iy/companyBols:
    get:
      summary: ImportYeti company BOLs
      operationId: iyCompanyBols
      x-google-backend:
        address: https://search-unified-187580267283.us-central1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      produces:
        - application/json
      parameters:
        - { name: company_id, in: query, type: string,  required: true }
        - { name: limit,      in: query, type: integer, required: false }
        - { name: offset,     in: query, type: integer, required: false }
      responses:
        '200':
          description: OK
    options:
      summary: CORS preflight
      operationId: corsIyCompanyBols
      security: []
      responses:
        '204':
          description: No content
          headers:
            Access-Control-Allow-Origin:      { type: string, default: "*" }
            Access-Control-Allow-Methods:     { type: string, default: "GET,OPTIONS" }
            Access-Control-Allow-Headers:     { type: string, default: "Content-Type,Authorization" }
            Access-Control-Max-Age:          { type: string, default: "3600" }

