      parameters:
        - name: "company_id"
          in: "query"
          type: "string"
          required: true
        - name: "limit"
          in: "query"
          type: "integer"
        - name: "offset"
          in: "query"
          type: "integer"
        - name: "start_date"
          in: "query"
          type: "string"
        - name: "end_date"
          in: "query"
          type: "string"
      responses:
        "200":
