name: Market search parser regression
on:
  pull_request:
    paths:
      - "frontend/src/api/pulse-explore-parse.js"
      - "frontend/src/api/pulse-explore-parse.test.js"
      - ".github/workflows/market-search-regression.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/api/pulse-explore-parse.js"
      - "frontend/src/api/pulse-explore-parse.test.js"
      - ".github/workflows/market-search-regression.yml"
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npx vitest run src/api/pulse-explore-parse.test.js
