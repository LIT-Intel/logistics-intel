name: Harvey forwarder evidence regression
on:
  pull_request:
    paths:
      - "frontend/src/lib/harvey/**"
      - ".github/workflows/harvey-forwarder-evidence.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/lib/harvey/**"
      - ".github/workflows/harvey-forwarder-evidence.yml"
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npx vitest run src/lib/harvey/forwarderEvidence.test.ts src/lib/harvey/companyForwarderEvidence.test.ts
