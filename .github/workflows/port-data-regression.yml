name: Port data integrity regression
on:
  pull_request:
    paths:
      - "frontend/src/lib/bols/**"
      - "frontend/src/components/company/AccountDossierV2.tsx"
      - "frontend/src/components/company/exportAccountDossierPdf.ts"
      - "frontend/src/features/company-profile/data/normalizeShipments.ts"
      - ".github/workflows/port-data-regression.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/lib/bols/**"
      - "frontend/src/components/company/AccountDossierV2.tsx"
      - "frontend/src/components/company/exportAccountDossierPdf.ts"
      - "frontend/src/features/company-profile/data/normalizeShipments.ts"
      - ".github/workflows/port-data-regression.yml"
permissions:
  contents: read
jobs:
  verified-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npx vitest run src/lib/bols/portValidity.test.ts
