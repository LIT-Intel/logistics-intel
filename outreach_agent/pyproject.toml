[project]
name = "lit-outreach-agent"
version = "0.1.0"
description = "Human-sounding, approval-gated sales outreach agent for Logistics Intel"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "openai-agents==0.21.1",
  "pydantic==2.12.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
